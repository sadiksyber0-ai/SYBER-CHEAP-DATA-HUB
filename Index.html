<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYBER CHEAP DATA</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header>
 <div class="logo">SYBER <span>CHEAP DATA</span></div>
 <a href="admin.html" style="background:#000;color:#fff;padding:8px 14px;border-radius:20px;text-decoration:none;font-size:13px">Admin</a>
</header>

<div class="hero">
 <h1>Ghana's Cheapest Data</h1>
 <p>MTN • Telecel • AirtelTigo - Instant Delivery 24/7</p>
</div>

<div id="bundles" class="bundles">Loading bundles...</div>

<!-- Order Modal -->
<div id="orderModal" class="order-box" style="display:none">
 <h2 id="orderTitle"></h2>
 <p id="orderPrice"></p>
 <p style="background:#fff7cc;padding:10px;border-radius:10px;margin-top:10px;font-size:13px">Send MoMo to: <b>024 XXXXXXX - SYBER CHEAP DATA</b></p>
 <input id="custPhone" placeholder="Your Number e.g 0241234567">
 <input id="momoRef" placeholder="MoMo Transaction ID">
 <button class="buy" onclick="submitOrder()">I Have Paid - Submit</button>
 <button onclick="closeModal()" style="width:100%;margin-top:10px;padding:10px;border:none;background:#eee;border-radius:12px">Cancel</button>
</div>

<script src="Supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
